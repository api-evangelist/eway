  docs: https://eway.io/api-v3/#api-versioning
  note: >-
    The Rapid API is versioned by an integer sent in the X-EWAY-APIVERSION
    header. Omitting the header pins the request to the original version 31.
    New fields are additive across versions (e.g. v40 added Transaction Query
    fields; v47 introduced new request/response fields and changed CardType in
    the response from integer to string).
