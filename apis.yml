name: eWAY
kind: company
description: >-
  eWAY (Eway) is an Australian online payment gateway founded in Sydney in 1998
  and now part of Global Payments Oceania, providing card-not-present payment
  acceptance for e-commerce merchants across Australia, New Zealand, and Asia.
  Its flagship developer surface is the Rapid API, a versioned HTTP payments
  API (currently version 47) that processes purchases, pre-authorisations, MOTO
  and recurring transactions, and tokenised (stored-card) payments, offered
  through seven integration methods ranging from server-to-server Direct
  Connection to PCI-scope-reducing Transparent Redirect, Secure Fields, and the
  Responsive Shared Page. Merchants authenticate with an API key and password
  over HTTP Basic auth, and eWAY publishes open-source MIT-licensed SDKs for
  PHP, Java, .NET, Node.js, Ruby, Android, and iOS plus a free sandbox. The
  Rapid API is genuinely API-first and well documented, but eWAY does not
  publish a downloadable OpenAPI/Swagger definition, and no public OAuth,
  webhooks catalog, or AsyncAPI event stream is documented.
