apis:
- aid: eway:eway-rapid-api
  name: eWAY Rapid API
  description: >-
    The eWAY Rapid API is a versioned HTTP payments API (v47) for processing
    card transactions. It exposes transaction creation (Direct Connection),
    AccessCode-based flows (Transparent Redirect / Responsive Shared Page /
    Secure Fields), transaction query by ID, and token-customer, refund, and
    cancel-authorisation operations. Supports REST/JSON (recommended), plus
    SOAP, XML, and RPC formats. Authentication is HTTP Basic (API key as
    username, password as password) with an X-EWAY-APIVERSION header.
  humanURL: https://eway.io/api-v3/
